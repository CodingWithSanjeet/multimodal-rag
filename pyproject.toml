[project]
name = "multimodal-rag"
version = "0.2.0"
description = "Multimodal RAG over PDFs (text, tables, charts and diagrams) with PyMuPDF, fastembed MiniLM, Pinecone and Groq vision/text LLMs, served with Streamlit."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastembed>=0.8.1",
    "groq>=0.37.1",
    "pandas>=2.2",
    "pillow>=11.0",
    "pinecone>=7.3.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
    "tabulate>=0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
