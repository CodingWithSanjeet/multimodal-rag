services:
  - type: web
    name: multimodal-rag
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && python -m mmrag.embeddings
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: SESSION_QUESTION_LIMIT
        value: "10"
      - key: DAILY_QUESTION_LIMIT
        value: "200"
